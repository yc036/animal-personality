[build]
  command = "npm run build"
  publish = "dist"
[build.environment]
  NODE_VERSION = "24"
[[redirects]]
  from = "/api/*"
  to = "https://oezgjmunhqowkunkdely.supabase.co/functions/v1/animal-api/:splat"
  status = 200
  force = true
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; connect-src 'self' https://*.supabase.co; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
